[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aktedirekt"
version = "0.1.0.dev"
description = "Aktedirekt – Schadenaufnahme und Sachstandsauskunft für Verkehrsunfallmandate, angebunden an jur|nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  # QR-Code für die Übergabe am Tresen. Reines Python, keine Abhängigkeiten.
  "segno>=1.6,<2",
]

[project.optional-dependencies]
aws = [
  # ASGI-Adapter für AWS Lambda hinter API Gateway; boto3 für DynamoDB, S3
  # und den Secrets Manager.
  "mangum>=0.17,<1",
  "boto3>=1.35,<2",
  "tzdata",
]
dev = [
  "pytest>=8",
  # Stellt AWS für die Prüfungen nach; es geht dabei nichts ins Netz.
  "moto[dynamodb,s3,secretsmanager]>=5,<6",
  "cfn-lint>=1",
  # Liest in den Prüfungen das PDF für die Akte zurück.
  "pypdf>=4",
]

[tool.setuptools.packages.find]
include = ["aktedirekt*"]

[tool.setuptools.package-data]
aktedirekt = ["sachstaende.json", "static/*", "texte/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
