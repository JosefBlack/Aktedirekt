# Kopie als infra/samconfig.toml anlegen (nicht eingecheckt) und Werte eintragen.
version = 0.1

[default.deploy.parameters]
stack_name = "aktedirekt-probe"
region = "eu-central-1"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = [
  "Stufe=probe",
  "AlarmEmail=it@kanzlei.example",
  "BudgetUsd=30",
  "BasisUrl=",
  "KanzleiTelefon=",
]
